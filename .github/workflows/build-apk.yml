name: Build RakshaOne APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT/licenses"
          SDKMANAGER=$(command -v sdkmanager || ls -1d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            { yes || true; } | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          fi
          ls -la "$SDK_ROOT/licenses"

      - name: Configure personal release signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > release-personal.jks
            echo "KEYSTORE_PATH=${{ github.workspace }}/release-personal.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${SECRET_KEY_ALIAS:-upload}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            rm -f release-personal.jks
            keytool -genkeypair -v -keystore release-personal.jks \
              -storepass "RakshaOne#2026" -alias "rakshaone_release" -keypass "RakshaOne#2026" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Susanta Banik,OU=RakshaOne,O=Susanta Banik"
            echo "KEYSTORE_PATH=${{ github.workspace }}/release-personal.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=RakshaOne#2026" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=rakshaone_release" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=RakshaOne#2026" >> "$GITHUB_ENV"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build RakshaOne Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare RakshaOne.apk & verify signature
        run: |
          cp app/build/outputs/apk/release/app-release.apk RakshaOne.apk
          APKSIGNER=$(ls -1d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          {
            echo "### RakshaOne APK Signing Certificate"
            echo '```'
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs RakshaOne.apk
            else
              keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload RakshaOne.apk
        uses: actions/upload-artifact@v4
        with:
          name: RakshaOne-APK
          path: RakshaOne.apk
          if-no-files-found: error
          retention-days: 30
