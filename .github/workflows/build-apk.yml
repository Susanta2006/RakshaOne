name: Build RakshaOne APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT/licenses"
          SDKMANAGER=$(command -v sdkmanager || ls -1d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            { yes || true; } | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          fi

      - name: Configure release signing keystore from GitHub Secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_TARGET="${{ github.workspace }}/release-personal.jks"
          rm -f "$KEYSTORE_TARGET"

          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            if [ -z "$SECRET_STORE_PASSWORD" ] || [ -z "$SECRET_KEY_PASSWORD" ]; then
              echo "::error::RELEASE_KEYSTORE_BASE64 is set, but KEYSTORE_PASSWORD or KEY_PASSWORD secret is missing."
              exit 1
            fi

            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_TARGET"
            ALIAS_TO_USE="${SECRET_KEY_ALIAS:-rakshaone_upload}"

            # Validate keystore & credentials before running Gradle
            keytool -list -keystore "$KEYSTORE_TARGET" -storepass "$SECRET_STORE_PASSWORD" -alias "$ALIAS_TO_USE" >/dev/null

            echo "KEYSTORE_PATH=$KEYSTORE_TARGET" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$ALIAS_TO_USE" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_SOURCE=GitHub Secrets (persistent release keystore)" >> "$GITHUB_ENV"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret not set; generating temporary personal release keystore for this run."
            keytool -genkeypair -v -keystore "$KEYSTORE_TARGET" \
              -storepass "RakshaOne#2026" -alias "rakshaone_release" -keypass "RakshaOne#2026" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Susanta Banik,OU=RakshaOne,O=Susanta Banik"
            echo "KEYSTORE_PATH=$KEYSTORE_TARGET" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=RakshaOne#2026" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=rakshaone_release" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=RakshaOne#2026" >> "$GITHUB_ENV"
            echo "SIGNING_SOURCE=Temporary fallback keystore (configure RELEASE_KEYSTORE_BASE64 secret for persistent updates)" >> "$GITHUB_ENV"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build RakshaOne Release APK & Play App Bundle (.aab)
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Prepare RakshaOne.apk & RakshaOne.aab & verify signatures
        run: |
          cp app/build/outputs/apk/release/app-release.apk RakshaOne.apk
          cp app/build/outputs/bundle/release/app-release.aab RakshaOne.aab
          APKSIGNER=$(ls -1d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          {
            echo "### RakshaOne Release Signing Summary"
            echo "- **Signing Source:** $SIGNING_SOURCE"
            echo "- **Artifacts:** \`RakshaOne.apk\` (direct install) & \`RakshaOne.aab\` (Google Play Console / Play App Signing)"
            echo '```'
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs RakshaOne.apk
            else
              keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E "Alias name:|Owner:|SHA1:|SHA256:"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up temporary keystore from runner
        if: always()
        run: rm -f "${{ github.workspace }}/release-personal.jks"

      - name: Upload RakshaOne.apk
        uses: actions/upload-artifact@v4
        with:
          name: RakshaOne-APK
          path: RakshaOne.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload RakshaOne.aab (Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: RakshaOne-PlayStore-AAB
          path: RakshaOne.aab
          if-no-files-found: error
          retention-days: 30
