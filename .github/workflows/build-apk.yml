name: Build RakshaOne APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Restore debug.keystore from base64
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build RakshaOne Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare RakshaOne.apk
        run: cp app/build/outputs/apk/release/app-release.apk RakshaOne.apk

      - name: Upload RakshaOne.apk
        uses: actions/upload-artifact@v4
        with:
          name: RakshaOne-APK
          path: RakshaOne.apk
          if-no-files-found: error
          retention-days: 30
