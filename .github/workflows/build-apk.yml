name: Build RakshaOne APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT/licenses"
          SDKMANAGER=$(command -v sdkmanager || ls -1d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            { yes || true; } | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          fi
          ls -la "$SDK_ROOT/licenses"

      - name: Restore debug.keystore from base64
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build RakshaOne Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare RakshaOne.apk
        run: cp app/build/outputs/apk/release/app-release.apk RakshaOne.apk

      - name: Upload RakshaOne.apk
        uses: actions/upload-artifact@v4
        with:
          name: RakshaOne-APK
          path: RakshaOne.apk
          if-no-files-found: error
          retention-days: 30
